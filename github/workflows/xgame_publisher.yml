name: xGame Global Spots & Events Weekly Publisher

on:
  schedule:
    # 每週一 (1)、週三 (3)、週五 (5) UTC 04:00 (亞洲時間 12:00 PM / 中午熱門時段)
    - cron: '0 4 * * 1,3,5'

  # 支援 GitHub 介面手動即時測試
  workflow_dispatch:
    inputs:
      category:
        description: '選擇主題 (AUTO 為自動依序輪播)'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - SKATE
          - SURF
          - CLIMB
          - EVENT
      lang:
        description: '選擇發布語言'
        required: true
        default: 'zh-hk'
        type: choice
        options:
          - zh-hk
          - zh-cn
          - ja
          - en

jobs:
  publish_xgame:
    name: Execute xGame Broadcast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chinese Fonts & Dependencies
        run: |
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install requests google-genai feedparser Pillow

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai feedparser

      - name: Run xGame Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          CAT_INPUT="${{ inputs.category }}"
          LANG_INPUT="${{ inputs.lang }}"

          [ -z "$CAT_INPUT" ] && CAT_INPUT="AUTO"
          [ -z "$LANG_INPUT" ] && LANG_INPUT="zh-hk"

          python xgame_publisher.py -c "$CAT_INPUT" -l "$LANG_INPUT"
