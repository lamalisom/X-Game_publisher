name: Daily Spot & Magazine Publisher

on:
  schedule:
    # UTC 10:30 = 香港時間 18:30 PM (傍晚推廣出行指南)
    - cron: '30 10 * * *'

  workflow_dispatch:
    inputs:
      category:
        description: '選擇運動項目 (Select Category)'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - SKATE
          - BMX
          - SURF
          - CLIMB
          - SNOW
      lang:
        description: '選擇發布語言 (Select Language)'
        required: true
        default: 'zh-hk'
        type: choice
        options:
          - zh-hk
          - zh-cn
          - en
          - ja

jobs:
  publish_spot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-wqy-zenhei
          pip install requests google-genai feedparser Pillow playwright boto3 python-dateutil beautifulsoup4
          npx playwright install-deps
          python -m playwright install chromium
          npm ci || npm install

      - name: Run Spot Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AMAZON_AFFILIATE_ID: ${{ secrets.AMAZON_AFFILIATE_ID || 'kait02bc-20' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'xgame-radar-media' }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAT_INPUT: ${{ inputs.category || 'AUTO' }}
          LANG_INPUT: ${{ inputs.lang || 'zh-hk' }}
        run: |
          # 明確傳入 "SPOT" 參數，強制生成場地導覽專題
          python xgame_publisher.py "$CAT_INPUT" "$LANG_INPUT" "SPOT"

      - name: Verify & Build Astro Static Magazine Site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Git Commit & Push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A src/content/posts/ xgame_radar.db
          if git diff --staged --quiet; then
            echo "無新文章異動，跳過提交。"
          else
            git commit -m "feat(magazine): publish daily spot & hotels guide [auto]"
            git pull --rebase --autostash origin main || true
            git push origin main || git push origin HEAD:main
          fi
