name: xgame_publisher

on:
  schedule:
    # Runs automatically every day at 04:00 UTC (12:00 PM HKT/MST)
    - cron: '0 4 * * *'

  workflow_dispatch:
    inputs:
      category:
        description: '選擇主題 (Select Category)'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - SKATE
          - SURF
          - CLIMBING
          - BMX
          - EVENT
      lang:
        description: '選擇發布語言 (Select Language)'
        required: true
        default: 'zh-hk'
        type: choice
        options:
          - zh-hk
          - zh-cn
          - ja
          - en

jobs:
  publish_xgame:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System CJK & Emoji Fonts, Python Dependencies
        run: |
          sudo apt-get update
          # 加入 fonts-noto-color-emoji 確保 Emoji 正常顯示
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-wqy-zenhei
          python -m pip install --upgrade pip
          pip install requests google-genai feedparser Pillow playwright boto3 python-dateutil

      - name: Install Playwright Browsers & System Dependencies
        run: |
          npx playwright install-deps
          python -m playwright install chromium

      - name: Run xGame Radar Engine
        env:
          # 1. 系統 API 金鑰與憑證
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREDICTHQ_TOKEN: ${{ secrets.PREDICTHQ_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 2. 處理定時觸發 (Cron) 時 inputs 為空的情況，設定預設值
          CAT_INPUT: ${{ inputs.category || 'AUTO' }}
          LANG_INPUT: ${{ inputs.lang || 'zh-hk' }}
        run: |
          python xgame_publisher.py
