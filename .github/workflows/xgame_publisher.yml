name: xGame Global Spots & Events Publisher

on:
  schedule:
    # Runs automatically every day at 04:00 UTC (12:00 PM HKT/MST)
    - cron: '0 4 * * *'

  workflow_dispatch:
    inputs:
      category:
        description: '選擇主題 (Select Category)'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - SKATE
          - SURF
          - CLIMBING
          - BMX
          - EVENT
      lang:
        description: '選擇發布語言 (Select Language)'
        required: true
        default: 'zh-hk'
        type: choice
        options:
          - zh-hk
          - zh-cn
          - ja
          - en

jobs:
  publish_xgame:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System CJK Fonts & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install requests google-genai feedparser Pillow playwright boto3 python-dateutil

      - name: Install Playwright Browsers & System Dependencies
        run: |
          npx playwright install-deps
          python -m playwright install chromium

      - name: Run xGame Radar Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREDICTHQ_TOKEN: ${{ secrets.PREDICTHQ_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CAT_INPUT="${{ inputs.category }}"
          LANG_INPUT="${{ inputs.lang }}"

          [ -z "$CAT_INPUT" ] && CAT_INPUT="AUTO"
          [ -z "$LANG_INPUT" ] && LANG_INPUT="zh-hk"

          python xgame_radar_engine.py
