name: xGame Global Spots & Events Publisher

on:
  schedule:
    # Runs automatically at 04:00 UTC on Monday, Wednesday, and Friday
    - cron: '0 4 * * 1,3,5'
  workflow_dispatch:
    inputs:
      category:
        description: '選擇主題 (Select Category)'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - SKATE
          - SURF
          - CLIMB
          - EVENT
      lang:
        description: '選擇發布語言 (Select Language)'
        required: true
        default: 'zh-hk'
        type: choice
        options:
          - zh-hk
          - zh-cn
          - ja
          - en

jobs:
  publish_xgame:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System CJK Fonts & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install requests google-genai feedparser Pillow

      - name: Run xGame Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CAT_INPUT="${{ inputs.category }}"
          LANG_INPUT="${{ inputs.lang }}"

          # Fallback defaults when triggered by cron schedule (inputs are empty)
          [ -z "$CAT_INPUT" ] && CAT_INPUT="AUTO"
          [ -z "$LANG_INPUT" ] && LANG_INPUT="zh-hk"

          python xgame_publisher.py -c "$CAT_INPUT" -l "$LANG_INPUT"
