name: Repost Article from R2

on:
  # 1. 支援在 GitHub 網頁手動觸發並輸入參數
  workflow_dispatch:
    inputs:
      filename:
        description: '輸入要重發的 JSON 檔名 (例如: 20260831_143022_SKATE.json，留空則自動處理)'
        required: false
        default: ''
  # 2. 定時任務 (若有的話)
  schedule:
    - cron: '0 12 * * *'

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 requests

      - name: Run Repost Script
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 將輸入的檔名傳給 Python 腳本
        run: |
          python repost_from_r2.py "${{ github.event.inputs.filename }}"
