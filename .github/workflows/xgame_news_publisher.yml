name: 🏆 xGame News & Events Radar (純新聞賽況)

on:
  schedule:
    # 每日香港時間 08:30 發布 (UTC 00:30) - 晨間賽事戰報通勤時段
    - cron: '30 0 * * *'

  workflow_dispatch:
    inputs:
      category:
        description: '運動項目 (Category)'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - SKATE
          - BMX
          - SURF
          - CLIMB
          - SNOW
      lang:
        description: '發布語言 (Language)'
        required: true
        default: 'zh-hk'
        type: choice
        options:
          - zh-hk
          - zh-cn
          - ja
          - en

jobs:
  publish_news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢出專案代碼 (Checkout Code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 環境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 CJK 中文字體、Python 依賴與 Playwright (Install Dependencies)
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
          python -m pip install --upgrade pip
          pip install google-genai requests pillow pydantic boto3 feedparser playwright
          playwright install --with-deps chromium

      - name: 🚀 執行純賽事新聞戰報生成 (Run News Publisher)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AMAZON_AFFILIATE_ID: ${{ secrets.AMAZON_AFFILIATE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAT_INPUT: ${{ github.event.inputs.category || 'AUTO' }}
          LANG_INPUT: ${{ github.event.inputs.lang || 'zh-hk' }}
        run: |
          echo "🔥 啟動【純即時賽事與選手新聞】發布引擎..."
          python xgame_publisher.py "$CAT_INPUT" "$LANG_INPUT" "NEWS"

      - name: 💾 自動提交並推播至 GitHub (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -A
          if git diff --staged --quiet; then
            echo "ℹ️ 今日無新的賽事新聞需要提交"
          else
            git commit -m "chore(news): 🏆 auto-publish xgame news & event briefing [skip ci]"
            git push origin main
          fi
